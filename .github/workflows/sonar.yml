name: SonarQube Analysis

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

# 同一个分支 / PR 又推了新提交：取消还没跑完的旧扫描，不让过时的扫描占着 Sonar 服务器
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 扫描并等待质量门禁：门禁不通过，这一步失败，PR 不能合并
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=BACH-AI-Tools_lunar_mcp_server
            -Dsonar.projectName=lunar_mcp_server
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scanner.skipJreProvisioning=true
