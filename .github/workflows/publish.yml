name: Publish to PyPI

# 在 GitHub 上发布一个 release（tag 形如 v1.0.1，必须和 pyproject.toml 的 version 一致）就会构建并发布到 PyPI。
# 用 PyPI Trusted Publishing（OIDC）：仓库里不存任何 PyPI 令牌。
# 一次性设置：pypi.org → bach-lunar-mcp → Manage → Publishing → Add a new publisher → GitHub：
#   owner = BACH-AI-Tools, repository = lunar_mcp_server, workflow = publish.yml, environment = pypi
on:
  release:
    types: [published]

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match pyproject.toml version $version (expected v$version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # 装上就崩的事故（1.0.0 配 mcp 2.x）不能再发出去：用干净环境装 wheel，跑一次 MCP 握手和 tools/list
      - name: Smoke-test the wheel (MCP handshake)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import json, subprocess
          p = subprocess.Popen(["/tmp/smoke/bin/bach-lunar-mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, cwd="/tmp")
          def send(m):
              p.stdin.write(json.dumps(m) + "\n"); p.stdin.flush()
          def recv():
              while True:
                  line = p.stdout.readline()
                  assert line, "server exited during the handshake"
                  m = json.loads(line)
                  if "id" in m:
                      return m
          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "release-smoke", "version": "0"}}})
          recv()
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools = [t["name"] for t in recv()["result"]["tools"]]
          print("tools:", tools)
          assert "jieqi_query" in tools
          send({"jsonrpc": "2.0", "id": 3, "method": "tools/call", "params": {"name": "jieqi_query", "arguments": {"year": 2026}}})
          text = recv()["result"]["content"][0]["text"]
          assert "24" in text, text[:300]
          p.terminate()
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
